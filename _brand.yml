# Shared colours and typography for the book.
# Palette: https://www.ucl.ac.uk/brand-and-experience/brand/visual-guidelines/colour
color:
  palette:
    ucl-dark-purple: "#361a54"
    ucl-white: "#fafafa"
    ucl-bright-purple: "#993bff"
    ucl-mid-purple: "#ba82ff"
    ucl-light-purple: "#ddbdff"
    ucl-pale-purple: "#eedeff"
    ucl-heritage-blue: "#30d6ff"
  # Pure white matches the opaque backgrounds of existing book images.
  background: "#ffffff"
  primary: ucl-bright-purple

# Cosmo already loads Source Sans Pro.
typography:
  fonts:
    - family: JetBrains Mono
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
      display: swap
  base:
    family: Source Sans Pro
    size: 18px
    line-height: 1.5
  headings:
    family: Source Sans Pro
    color: ucl-dark-purple
  link:
    color: ucl-bright-purple
    decoration: underline
  monospace:
    family: JetBrains Mono
