<img class="slide-logo" src="../ucl-logo.png" alt="" role="presentation">
<script>
document.querySelector('.reveal').append(document.querySelector('img.slide-logo'));
// The repeated UCL branding is decorative; the document title names the course.
document.querySelectorAll('img.slide-logo').forEach((logo) => {
  logo.alt = '';
  logo.setAttribute('role', 'presentation');
  logo.removeAttribute('aria-label');
});
</script>
