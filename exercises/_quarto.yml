# Catalogue order follows this list: fewer prerequisite chapters first.
# Task and answer pages disable the inherited listing in their front matter.
listing:
  contents:
    - london_terrorist_attacks/index.qmd
    - retiro_homicides/index.qmd
    - vancouver_vehicle_thefts/index.qmd
    - montreal_mefait/index.qmd
    - new_york_shootings/index.qmd
    - sao_paulo_homicides/index.qmd
    - queensland_stalking/index.qmd
    - poland_property_crime/index.qmd
  type: table
  fields: [title, ready-after, output-type]
  field-display-names:
    ready-after: "Attempt after"
    output-type: "You will create"
  sort: false
  sort-ui: false
  filter-ui: false

lang: en-GB
website:
  title: "Crime mapping exercises"
  site-url: https://books.lesscrime.info/learncrimemapping/2026/exercises/
  description: "Practice exercises accompanying Learn Crime Mapping with R."
  navbar:
    left:
      - href: index.qmd
        text: Exercises
      - href: https://books.lesscrime.info/learncrimemapping/2026/
        text: Textbook
  search: true
  page-footer:
    center: "2026 edition · Matt Ashby · CC BY 4.0"

format:
  html:
    theme: cosmo
    fontsize: 18px
    toc: true
    code-copy: true
    code-line-numbers: true
    code-annotations: below
    css: styles.css
    grid:
      body-width: 900px

execute:
  freeze: auto
